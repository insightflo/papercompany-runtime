name: PR

on:
  pull_request:
    branches:
      - main
  # lockfile 봇 PR은 GITHUB_TOKEN으로 만들어져 pull_request 이벤트가 발생하지 않는다.
  # refresh-lockfile.yml 이 이 워크플로를 해당 ref로 직접 dispatch해 필수 검사(policy)만 붙인다.
  workflow_dispatch:

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block manual lockfile edits
        if: github.event_name == 'pull_request' && github.head_ref != 'chore/refresh-lockfile'
        run: |
          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
          if printf '%s\n' "$changed" | grep -qx 'pnpm-lock.yaml'; then
            echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # [write-chokepoint static guard] heartbeat_runs/workflow_runs 직접 상태 쓰기(
      # .update(heartbeatRuns|workflowRuns) 및 동등 raw SQL UPDATE)를 인가된 쓰기
      # 계층(heartbeat-queue-lifecycle.ts, heartbeat-finalization/*)으로 강제한다.
      # reboot-1107 §4.3 no-regret #1 — PR #679/#682 유형의 초크포인트 우회 재발 차단.
      # --self-test 로 가드 자체의 탐지 능력(합성 bypass)을 매 실행마다 검증한다.
      - name: Enforce run-status write chokepoint
        run: |
          node scripts/check-run-status-write-chokepoint.mjs --self-test
          node scripts/check-run-status-write-chokepoint.mjs

      - name: Validate Dockerfile deps stage
        run: |
          missing=0

          # Extract only the deps stage from the Dockerfile
          deps_stage="$(awk '/^FROM .* AS deps$/{found=1; next} found && /^FROM /{exit} found{print}' Dockerfile)"

          if [ -z "$deps_stage" ]; then
            echo "::error::Could not extract deps stage from Dockerfile (expected 'FROM ... AS deps')"
            exit 1
          fi

          # Derive workspace search roots from pnpm-workspace.yaml (exclude dev-only packages)
          search_roots="$(grep '^ *- ' pnpm-workspace.yaml | sed 's/^ *- //' | sed 's/\*$//' | grep -v 'examples' | grep -v 'create-paperclip-plugin' | tr '\n' ' ')"

          if [ -z "$search_roots" ]; then
            echo "::error::Could not derive workspace roots from pnpm-workspace.yaml"
            exit 1
          fi

          # Check all workspace package.json files are copied in the deps stage
          for pkg in $(find $search_roots -maxdepth 2 -name package.json -not -path '*/examples/*' -not -path '*/create-paperclip-plugin/*' -not -path '*/node_modules/*' 2>/dev/null | sort -u); do
            dir="$(dirname "$pkg")"
            if ! echo "$deps_stage" | grep -q "^COPY ${dir}/package.json"; then
              echo "::error::Dockerfile deps stage missing: COPY ${pkg} ${dir}/"
              missing=1
            fi
          done

          # Check patches directory is copied if it exists
          if [ -d patches ] && ! echo "$deps_stage" | grep -q '^COPY patches/'; then
            echo "::error::Dockerfile deps stage missing: COPY patches/ patches/"
            missing=1
          fi

          if [ "$missing" -eq 1 ]; then
            echo "Dockerfile deps stage is out of sync. Update it to include the missing files."
            exit 1
          fi

      - name: Validate dependency resolution when manifests change
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # workflow_dispatch(lockfile 봇 PR 검사)에는 PR 컨텍스트가 없으므로 main 대비로 계산한다.
          if [ -z "$base" ] || [ -z "$head" ]; then
            base="$(git rev-parse origin/main)"
            head="$(git rev-parse HEAD)"
          fi
          changed="$(git diff --name-only "$base" "$head")"
          manifest_pattern='(^|/)package\.json$|^pnpm-workspace\.yaml$|^\.npmrc$|^pnpmfile\.(cjs|js|mjs)$'
          if printf '%s\n' "$changed" | grep -Eq "$manifest_pattern"; then
            pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          fi

  # [verify-test-sharding] 테스트를 3 샤드로 병렬 분산 — EP(임베디드 PG) 테스트 170파일
  #   풀스위트가 CI 20분 한계에 13~15분으로 근접, 러너 편차 시 초과 취소(2026-08-29 #170 초과 사례).
  #   샤드당 실측 ~1/3(로컬 109s/292s 선형). verify(타입체크·빌드·카나리)와 병렬로 돈다.
  verify:
    needs: [policy]
    # dispatch(lockfile 봇 PR)에서는 policy만 필요하다 — 무거운 작업은 PR 이벤트에서만 돈다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Install dependencies from the CI-refreshed lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build
        run: pnpm build

      - name: Release canary dry run
        run: |
          git checkout -B master HEAD
          git checkout -- pnpm-lock.yaml
          ./scripts/release.sh canary --skip-verify --dry-run

  verify-tests:
    needs: [policy]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Install dependencies from the CI-refreshed lockfile
        run: pnpm install --frozen-lockfile

      - name: Run tests (shard ${{ matrix.shard }}/3)
        run: pnpm test:run --shard=${{ matrix.shard }}/3

  e2e:
    needs: [policy]
    if: github.event_name == 'pull_request'
    # Playwright 1.58 does not support Chromium on Ubuntu 26.04 yet. Pin the
    # E2E runner so GitHub's ubuntu-latest migration cannot skip the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Install dependencies from the CI-refreshed lockfile
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip/instances/default
          cat > ~/.paperclip/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_PORT: "3100"
          PAPERCLIP_E2E_SKIP_LLM: "true"
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
