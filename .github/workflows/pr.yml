name: PR

# [CI-REDUCE 2026-11-13] PR push 마다 7잡(policy·verify·verify-tests 3샤드·verify-tests-serial·e2e) 전량을
#   돌리던 구성을 "경량 잡 1개 + 조건부 전체 스위트"로 나눈다. 줄이려는 것은 잡당 시간이 아니라 실행 횟수다
#   (실측: 성공 run 40~45분, verify-tests 샤드 13~23분, push 반복 시 매번 전량 재실행).
#   · 경량 잡(policy) = 비드래프트 push 마다. 설치·타입체크까지(문서 전용 변경이면 그마저 생략)
#   · 전체 스위트      = ready_for_review 전환 / ci-full 라벨 / dispatch(scope=full) 일 때만
#   · 드래프트 PR      = 라벨이 없으면 정책 스텝을 돌리지 않는다(라벨은 명시 요청이라 실행)
#   판정은 scripts/ci-scope.sh 가 소유한다(행렬 시험: server/src/__tests__/ci-scope-script.test.ts).
#   워크플로 `if:` 에 같은 규칙을 복제하지 않는다 — 복제하면 시험이 실제 실행 경로를 검증하지 못한다.
on:
  pull_request:
    branches:
      - main
    # labeled 가 없으면 병합 파이프라인이 부착하는 ci-full 라벨로 전체 스위트를 깨울 수 없다.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  # lockfile 봇 PR은 GITHUB_TOKEN으로 만들어져 pull_request 이벤트가 발생하지 않는다.
  # refresh-lockfile.yml 이 이 워크플로를 해당 ref로 직접 dispatch해 필수 검사(policy)만 붙인다.
  # scope=full 은 사람이 전체 스위트를 수동으로 한 번 더 돌리는 경로다(기본값은 봇 경로 유지).
  workflow_dispatch:
    inputs:
      scope:
        description: "policy = 필수 검사만(lockfile 봇 경로), full = 전체 스위트"
        type: choice
        options:
          - policy
          - full
        default: policy

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # policy 는 브랜치 보호의 필수 상태 체크다(required_status_checks=[policy]). 이름·id 를 바꾸지 않는다.
  policy:
    runs-on: ubuntu-latest
    # 타입체크가 들어와 5분으로는 부족하다(설치 + pnpm -r typecheck).
    timeout-minutes: 20
    outputs:
      heavy: ${{ steps.scope.outputs.heavy }}
      full: ${{ steps.scope.outputs.full }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      reason: ${{ steps.scope.outputs.reason }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 문서 전용 판정에 merge-base 가 필요하다.
          fetch-depth: 0

      # PR 변경 목록의 유일한 출처. 아래 검사 스텝들은 다시 git diff 하지 않고 이 파일을 읽는다.
      - name: Resolve change range
        id: range
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            # workflow_dispatch 에는 pull_request 페이로드가 없다.
            base="$(git rev-parse origin/main)"
            head="$(git rev-parse HEAD)"
          fi
          # 세 점(base...head) = merge-base..head. 두 점 diff 는 main 이 전진한 만큼을 PR 변경으로 잘못 세어
          # 문서 전용 판정을 무력화한다. 실패하면 두 점, 그것도 실패하면 빈 목록으로 떨어진다.
          git diff --name-only "$base...$head" > "$RUNNER_TEMP/changed.txt" 2>/dev/null \
            || git diff --name-only "$base" "$head" > "$RUNNER_TEMP/changed.txt" 2>/dev/null \
            || : > "$RUNNER_TEMP/changed.txt"
          echo "changed files: $(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ')"
          cat "$RUNNER_TEMP/changed.txt"

      - name: Resolve CI scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          INPUT_SCOPE: ${{ inputs.scope }}
          CI_FULL_LABEL: ci-full
          CHANGED_FILE_LIST: ${{ runner.temp }}/changed.txt
        run: bash scripts/ci-scope.sh

      - name: Skip heavy checks (docs-only or draft)
        if: steps.scope.outputs.heavy != 'true'
        run: |
          echo "경량 검사 생략 — reason=${{ steps.scope.outputs.reason }}"
          echo "문서 전용 변경이면 CI 비용을 쓰지 않고, 라벨 없는 드래프트면 ready_for_review/ci-full 전까지 실행하지 않는다."

      - name: Block manual lockfile edits
        if: steps.scope.outputs.heavy == 'true' && github.event_name == 'pull_request' && github.head_ref != 'chore/refresh-lockfile'
        run: |
          if grep -qx 'pnpm-lock.yaml' "$RUNNER_TEMP/changed.txt"; then
            echo "Do not commit pnpm-lock.yaml in pull requests. CI owns lockfile updates."
            exit 1
          fi

      - name: Setup pnpm
        if: steps.scope.outputs.heavy == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        if: steps.scope.outputs.heavy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # 이제 policy 가 설치·타입체크를 하므로 매 push 가 콜드 스토어로 돌지 않게 캐시를 쓴다.
          cache: pnpm

      # [write-chokepoint static guard] heartbeat_runs/workflow_runs 직접 상태 쓰기(
      # .update(heartbeatRuns|workflowRuns) 및 동등 raw SQL UPDATE)를 인가된 쓰기
      # 계층(heartbeat-queue-lifecycle.ts, heartbeat-finalization/*)으로 강제한다.
      # reboot-1107 §4.3 no-regret #1 — PR #679/#682 유형의 초크포인트 우회 재발 차단.
      # --self-test 로 가드 자체의 탐지 능력(합성 bypass)을 매 실행마다 검증한다.
      - name: Enforce run-status write chokepoint
        if: steps.scope.outputs.heavy == 'true'
        run: |
          node scripts/check-run-status-write-chokepoint.mjs --self-test
          node scripts/check-run-status-write-chokepoint.mjs

      - name: Validate Dockerfile deps stage
        if: steps.scope.outputs.heavy == 'true'
        run: bash scripts/check-dockerfile-deps-stage.sh

      - name: Validate dependency resolution when manifests change
        if: steps.scope.outputs.heavy == 'true'
        run: |
          manifest_pattern='(^|/)package\.json$|^pnpm-workspace\.yaml$|^\.npmrc$|^pnpmfile\.(cjs|js|mjs)$'
          if grep -Eq "$manifest_pattern" "$RUNNER_TEMP/changed.txt"; then
            pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          fi

      # 타입체크는 경량 잡으로 옮겼다(매 push 신호 유지). verify 는 번들·배포 산출물을 본다.
      - name: Install dependencies
        if: steps.scope.outputs.heavy == 'true'
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Install dependencies from the CI-refreshed lockfile
        if: steps.scope.outputs.heavy == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.scope.outputs.heavy == 'true'
        run: pnpm -r typecheck

  # [CI-REDUCE] 문서 전용 변경에서는 전체 스위트를 돌리지 않는다. 그 사실을 **구조화된 신호**로 남긴다:
  #   잡 이름이 verify-tests 로 시작하고 conclusion 이 success 이므로, 병합 파이프라인의 ci_baseline_guard
  #   (성공한 verify-tests 잡이 0개면 병합하지 않는다)가 "테스트 미실행"과 "전체 스위트 불필요"를 구분한다.
  #   이 잡이 없으면 문서 전용 PR(선례: PR#701 README·docs 만 변경)이 영구 미병합이 된다.
  verify-tests-docs-only:
    needs: [policy]
    if: needs.policy.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Attest documentation-only scope
        run: |
          echo "documentation-only change: full suite intentionally skipped"
          echo "policy reason: ${{ needs.policy.outputs.reason }}"

  # [verify-test-sharding] 테스트를 3 샤드로 병렬 분산 — EP(임베디드 PG) 테스트 170파일
  #   풀스위트가 CI 20분 한계에 13~15분으로 근접, 러너 편차 시 초과 취소(2026-08-29 #170 초과 사례).
  #   샤드당 실측 ~1/3(로컬 109s/292s 선형). verify(빌드·카나리)와 병렬로 돈다.
  #
  # [CI-REDUCE] 아래 네 잡은 전체 스위트다 — policy.outputs.full 이 true 일 때만 돈다
  # (ready_for_review / ci-full 라벨 / dispatch scope=full). dispatch 기본값(policy)은 예전과 같이 policy 만 돈다.
  verify:
    needs: [policy]
    if: needs.policy.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm·Node 설정 + lockfile 2단계 설치는 composite action 하나로 모았다(.github/actions/ci-install).
      - uses: ./.github/actions/ci-install

      - name: Build
        run: pnpm build

      - name: Release canary dry run
        run: |
          git checkout -B master HEAD
          git checkout -- pnpm-lock.yaml
          ./scripts/release.sh canary --skip-verify --dry-run

  verify-tests:
    needs: [policy]
    if: needs.policy.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm·Node 설정 + lockfile 2단계 설치는 composite action 하나로 모았다(.github/actions/ci-install).
      - uses: ./.github/actions/ci-install

      - name: Run tests (shard ${{ matrix.shard }}/3)
        # [ci-serial-split] 중량 통합 스위트 3종은 전용 직렬 잡(verify-tests-serial)이 독점 실행한다.
        #   샤드에서 제외해 중복 실행·경합(4-fork 동시 embedded-PG + Python 락)을 원천 차단한다.
        env:
          PAPERCLIP_CI_EXCLUDE_SERIAL_SUITES: "1"
        run: pnpm test:run --shard=${{ matrix.shard }}/3

  # [ci-serial-split] 중량 통합 스위트 3종 전용 직렬 잡 — 파일별 1개 프로세스씩 독점 실행하여
  #   4-fork 동시 embedded-PG + Python 락 경합을 원천 제거한다. 잡 이름을 verify-tests 접두사로
  #   유지해 pi-serial-merge.sh 의 startswith("verify-tests") 병합 가드(L149–152)가 코드 수정
  #   없이 이 잡을 자동 감시하게 한다. 루트 pnpm test:run 으로 실행해 Vitest 멀티프로젝트 출력
  #   형식(FAIL @paperclipai/server src/__tests__/... [ server/src/__tests__/... ])을 기존 샤드와
  #   동일하게 유지한다(--filter exec vitest 사용 금지 — 브래킷 경로가 달라짐).
  verify-tests-serial:
    needs: [policy]
    if: needs.policy.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm·Node 설정 + lockfile 2단계 설치는 composite action 하나로 모았다(.github/actions/ci-install).
      - uses: ./.github/actions/ci-install

      - name: Run heavy integration tests serially
        run: |
          pnpm test:run --no-file-parallelism \
            server/src/__tests__/heartbeat-c5-public-activation.test.ts \
            server/src/__tests__/qa-remediation-admission-root.test.ts \
            server/src/__tests__/mission-owner-authority-flow.integration.test.ts

  e2e:
    needs: [policy]
    if: needs.policy.outputs.full == 'true'
    # Playwright 1.58 does not support Chromium on Ubuntu 26.04 yet. Pin the
    # E2E runner so GitHub's ubuntu-latest migration cannot skip the tests.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm·Node 설정 + lockfile 2단계 설치는 composite action 하나로 모았다(.github/actions/ci-install).
      - uses: ./.github/actions/ci-install

      - name: Build
        run: pnpm build

      - name: Install Playwright
        # [ci-s1] ubuntu-24.04 apt 미러/목록 일시 오류(exit 100)에 대한 3회 재시도 + apt update 재시도 래퍼.
        run: |
          for attempt in 1 2 3; do
            if sudo apt-get update -o Acquire::Retries=3 && npx playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright install attempt ${attempt} failed; retrying in 10s..." >&2
            sleep 10
          done
          exit 1

      - name: Generate Paperclip config
        run: |
          mkdir -p ~/.paperclip/instances/default
          cat > ~/.paperclip/instances/default/config.json << 'CONF'
          {
            "$meta": { "version": 1, "updatedAt": "2026-01-01T00:00:00.000Z", "source": "onboard" },
            "database": { "mode": "embedded-postgres" },
            "logging": { "mode": "file" },
            "server": { "deploymentMode": "local_trusted", "host": "127.0.0.1", "port": 3100 },
            "auth": { "baseUrlMode": "auto" },
            "storage": { "provider": "local_disk" },
            "secrets": { "provider": "local_encrypted", "strictMode": false }
          }
          CONF

      - name: Run e2e tests
        env:
          PAPERCLIP_E2E_PORT: "3100"
          PAPERCLIP_E2E_SKIP_LLM: "true"
        run: pnpm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          retention-days: 14
