name: Verify A1 Papercompany (no deployment)
# Legacy remote deployment is retired. See doc/DEPLOYMENT-SAFETY.md.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-a1-papercompany
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Run deployment smoke tests
        run: pnpm vitest run server/src/__tests__/health.test.ts server/src/__tests__/app-ui-root.test.ts

      - name: Build
        run: pnpm build
