name: Refresh Lockfile

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: refresh-lockfile-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # 필수 검사(policy)를 봇 PR에 붙이기 위해 pr.yml을 workflow_dispatch로 실행한다.
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Refresh pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile

      - name: Fail on unexpected file changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lockfile is already up to date."
            exit 0
          fi
          if printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"
            echo "$changed"
            exit 1
          fi

      - name: Create or update pull request
        id: upsert-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged, nothing to do."
            echo "pr_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCH="chore/refresh-lockfile"
          git config user.name "lockfile-bot"
          git config user.email "lockfile-bot@users.noreply.github.com"

          git checkout -B "$BRANCH"
          git add pnpm-lock.yaml
          git commit -m "chore(lockfile): refresh pnpm-lock.yaml"
          git push --force origin "$BRANCH"

          # Create PR if one doesn't already exist
          existing=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh pr create \
              --head "$BRANCH" \
              --title "chore(lockfile): refresh pnpm-lock.yaml" \
              --body "Auto-generated lockfile refresh after dependencies changed on main. This PR only updates pnpm-lock.yaml."
            echo "Created new PR."
          else
            echo "PR #$existing already exists, branch updated via force push."
          fi
          echo "pr_created=true" >> "$GITHUB_OUTPUT"

      - name: Attach required policy check to the lockfile PR
        id: attach-checks
        if: steps.upsert-pr.outputs.pr_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/refresh-lockfile
        run: |
          set -uo pipefail
          # GITHUB_TOKEN이 만든 PR은 pull_request 이벤트를 발생시키지 않아 필수 검사 policy가 붙지 않고
          # required check(strict) 때문에 영구 BLOCKED가 된다. workflow_dispatch는 GITHUB_TOKEN으로도
          # 트리거되므로, pr.yml을 같은 ref로 직접 실행해 policy 검사만 붙인다(pr.yml이 dispatch 시 무거운 job을 건너뛰게 되어 있다).
          if ! gh workflow run pr.yml --ref "$BRANCH"; then
            echo "::error::pr.yml dispatch failed"
            exit 1
          fi
          head="$(gh pr view "$BRANCH" --json headRefOid --jq .headRefOid)"
          for _ in $(seq 1 18); do
            attached="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head/check-runs" \
              --jq '[.check_runs[] | select(.name == "policy")] | length' 2>/dev/null || echo 0)"
            if [ "${attached:-0}" -gt 0 ]; then
              echo "policy check attached to $head"
              exit 0
            fi
            sleep 10
          done
          echo "::error::policy 검사가 3분 안에 붙지 않았다 — GITHUB_TOKEN workflow_dispatch 트리거 경로를 재검토해야 한다."
          exit 1

      - name: Enable auto-merge for lockfile PR
        if: steps.upsert-pr.outputs.pr_created == 'true'
        # 저장소 설정 allow_auto_merge=false 인 동안에는 실패가 정상이다(설정 변경은 승인 범위 밖).
        # 검사가 붙은 PR은 병합 루프/운영자가 병합한다.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_url="$(gh pr list --head chore/refresh-lockfile --json url --jq '.[0].url')"
          if [ -z "$pr_url" ]; then
            echo "Error: lockfile PR was not found." >&2
            exit 1
          fi

          gh pr merge --auto --squash --delete-branch "$pr_url"
