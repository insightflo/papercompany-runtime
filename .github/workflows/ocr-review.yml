name: OCR Review

on:
  # Review once per merge instead of on every PR update: this repo squash-merges,
  # so one review of the merged PR covers exactly what landed on main.
  #
  # `pull_request: [closed]` rather than `push`: the pinned v1.12.2 action reads
  # the base ref, the head sha and the PR number from the pull_request payload
  # only. On `push` all three are empty, so it would review an empty workspace
  # diff and have no PR to post the summary to — a silent no-op that
  # `continue-on-error` keeps green.
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  # Per-PR queue, never cancelled: the single run a PR gets is the one at merge
  # time, and cancelling it would leave that merge without an advisor review.
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # `closed` also fires for PRs abandoned without merging; only merged PRs
    # reach main.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: AI code review (advisor)
        id: ocr
        # Advisor only: an LLM outage must not mark the PR red.
        continue-on-error: true
        # Pinned to the exact v1.12.2 commit (matches the tag; also the
        # build hash reported by the v1.12.2 CLI) instead of the movable tag.
        uses: alibaba/open-code-review@b3dbcb634cbb39344e0a3c48ccb1cef3ecd51532 # v1.12.2
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ secrets.OCR_LLM_USE_ANTHROPIC }}
          # glm-5.3-flash with thinking enabled + max reasoning effort.
          # Explicit reasoning_effort here overrides the action's
          # thinking-disabled default extra_body.
          llm_extra_body: '{"thinking": {"type": "enabled"}, "reasoning_effort": "max"}'
          language: Korean
          sticky_summary: 'true'

      - name: Warn on advisor failure
        if: steps.ocr.outcome == 'failure'
        run: echo "::warning::OCR advisor review failed (LLM outage or misconfiguration). Checks are not blocked; inspect the OCR Review workflow log."
