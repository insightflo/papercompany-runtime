name: OCR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ocr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: AI code review (advisor)
        uses: alibaba/open-code-review@v1.12.2
        with:
          llm_url: ${{ secrets.OCR_LLM_URL }}
          llm_auth_token: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          llm_model: ${{ secrets.OCR_LLM_MODEL }}
          llm_use_anthropic: ${{ secrets.OCR_LLM_USE_ANTHROPIC }}
          # glm-5.3-flash with thinking enabled + max reasoning effort.
          # Explicit reasoning_effort here overrides the action's
          # thinking-disabled default extra_body.
          llm_extra_body: '{"thinking": {"type": "enabled"}, "reasoning_effort": "max"}'
          language: Korean
          sticky_summary: 'true'
